name: Course Materials Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/materials_index.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/materials_index.json'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
